# Optimization branch: config C + query rewrite, evaluated separately (20 runs).
# The rewriter never sees gold answers or evidence, and falls back to the
# original query on error.
extends = "C.toml"
name = "C+rewrite"

[optimization]
kind = "rewrite"

[optimization.rewrite]
model = "claude-opus-5-5"                # called with effort "low" (src/answer/generator.py make_rewrite_llm)
timeout_s = 10
