# Shared by every config. A, B and C must differ only in [retrieval]
# (checked by config.check_shared_settings). Paths are relative to the repo root.
# Values marked TBD are placeholders to set before the first index build.

[docs]
doc_version = "MAN-STAY-261116"          # manual edition 2026-11-16 (docs/document_index.md)
source_path = "data/raw/manual.pdf"      # raw file; its hash is added to doc_version
documents_csv = "docs/document_index.md" # chapter-level doc_ids (not read by code yet)

[index]
# Chunks follow the manual's structure (#### items, else ### / ##); only sections longer
# than chunk_size chars are split further at paragraph breaks, with no overlap (src/ingest/chunk.py MAXLEN).
chunk_size = 1200
chunk_overlap = 0
chunk_unit = "chars"
embedding_model = "nlpai-lab/KURE-v1"    # team decision 2026-11-25; local, 1024-dim (src/build_vectors.py --model)
bm25_tokenizer = "kiwipiepy+visa-code"   # src/tokenizer.py: kiwi morphemes, visa codes (D-2-2) kept whole
index_dir = "data/index"

[generation]                             # identical for A/B/C
model = "claude-opus-5-5"
temperature = 0.0                        # NOT sent: Claude Opus 5.5 rejects temperature (400). Depth = effort (LLM_EFFORT in .env, default medium)
max_output_tokens = 16000                # includes thinking tokens; 1024 truncates answers (max_tokens stop -> model_error)
timeout_s = 60
max_retries = 1                          # API retries (ChatAnthropic). Format errors are re-asked once separately

[prompt]                                 # identical for A/B/C
label = "v1"
template_path = "src/answer/templates/answer_v1.txt"
max_context_chunks = 5
max_context_chars = 8000

[evidence_gate]                          # tuned on dev.json only
method = "model_judgment"
params = {}

[eval]
version = "eval-v0.1"                    # set to the frozen tag before final runs
